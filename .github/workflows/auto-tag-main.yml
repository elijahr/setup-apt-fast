---
name: Auto Tag Main

'on':
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  auto-tag:
    name: Create automatic tag for main
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # Get the latest version tag
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing version tags found, starting with v0.1.0"
            LATEST_TAG="v0.0.0"
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: \"$LATEST_TAG\""

      - name: Calculate next version
        id: next-version
        env:
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.latest_tag }}
        run: |
          # Extract version numbers
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
          else
            MAJOR=0
            MINOR=0
            PATCH=0
          fi

          # Increment patch version for main builds
          PATCH=$((PATCH + 1))

          # Create new version tag with -dev suffix for main branch
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}-dev.${GITHUB_RUN_NUMBER}"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: \"$NEW_TAG\""
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check-tag
        env:
          NEW_TAG: ${{ steps.next-version.outputs.new_tag }}
        run: |
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag \"$NEW_TAG\" already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag \"$NEW_TAG\" does not exist"
          fi

      - name: Create and push tag
        if: steps.check-tag.outputs.exists == 'false'
        env:
          NEW_TAG: ${{ steps.next-version.outputs.new_tag }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag
          git tag -a "$NEW_TAG" -m "Automatic main build $NEW_TAG

          Commit: ${{ github.sha }}
          Branch: main
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_id }}"

          # Push tag
          git push origin "$NEW_TAG"

          echo "Successfully created and pushed tag: \"$NEW_TAG\""

      - name: Create pre-release
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.next-version.outputs.new_tag }}
        run: |
          # Generate changelog for this build
          LATEST_TAG="${{ steps.get-latest-tag.outputs.latest_tag }}"

          CHANGELOG=$(cat <<EOF
          ## Development Build

          This is an automatic development build from the \`main\` branch.

          ### Changes since $LATEST_TAG

          $(git log "$LATEST_TAG"..HEAD --pretty=format:"* %s (%h)" --reverse)

          ---

          **⚠️ Warning**: This is a development build and may be unstable. For production use, please use a stable release.

          **Commit**: ${{ github.sha }}
          **Branch**: main
          EOF
          )

          # Create pre-release
          echo "$CHANGELOG" | gh release create "$NEW_TAG" \
            --title "$NEW_TAG (Development Build)" \
            --notes-file - \
            --prerelease \
            --target main

          echo "Pre-release created: \"$NEW_TAG\""

      - name: Create summary
        if: steps.check-tag.outputs.exists == 'false'
        env:
          NEW_TAG: ${{ steps.next-version.outputs.new_tag }}
        run: |
          {
            echo "## Auto-Tag Created"
            echo ""
            echo "✅ Automatically tagged main branch"
            echo ""
            echo "- **Previous tag**: \`${{ steps.get-latest-tag.outputs.latest_tag }}\`"
            echo "- **New tag**: \`${NEW_TAG}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Pre-release**: https://github.com/${{ github.repository }}/releases/tag/$NEW_TAG"
            echo ""
            echo "### Usage"
            echo "\`\`\`yaml"
            echo "uses: ${{ github.repository }}@${NEW_TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag already exists
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          {
            echo "## Tag Already Exists"
            echo ""
            echo "⚠️ Tag \`${{steps.next-version.outputs.new_tag}}\` already exists"
            echo ""
            echo "Skipping tag creation."
          } >> "$GITHUB_STEP_SUMMARY"
