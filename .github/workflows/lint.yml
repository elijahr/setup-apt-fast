---
name: Lint

'on':
  push:
    branches: [main, master]
    paths:
      - 'action.yml'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'action.yml'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          level: error

  validate-action:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate action metadata
        run: |
          # Check if action.yml exists
          if [ ! -f "action.yml" ]; then
            echo "Error: action.yml not found"
            exit 1
          fi

          # Check for required fields
          if ! grep -q "^name:" action.yml; then
            echo "Error: action.yml missing 'name' field"
            exit 1
          fi

          if ! grep -q "^description:" action.yml; then
            echo "Error: action.yml missing 'description' field"
            exit 1
          fi

          if ! grep -q "^runs:" action.yml; then
            echo "Error: action.yml missing 'runs' field"
            exit 1
          fi

          echo "✅ action.yml validation passed"

      - name: Check YAML syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}, comments: {min-spaces-from-content: 1}}}" action.yml .github/workflows/*.yml
